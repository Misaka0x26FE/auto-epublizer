[project]
name = "auto-epublizer"
version = "0.1.0"
description = "翻译 + 转 EPUB 的 Python CLI：外语文献 → 任意目标语言，复杂文件 → 标准 EPUB 3"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "lxml>=5.0",
    "pymupdf>=1.24",
    "json-repair>=0.61,<1",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=8.0", "ruff>=0.12"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
auto-epublizer = "auto_epublizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_epublizer"]
